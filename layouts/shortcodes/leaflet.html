{{- $id := .Get "id" | default "map1" }}
{{- $lat := .Get "lat" | default "29.71" }}
{{- $lon := .Get "lon" | default "118.31" }}
{{- $zoom := .Get "zoom" | default "12" }}
{{- $popup := .Get "popup" | default "我的位置" }}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div id="{{ $id }}" style="height: 400px; width: 100%; border-radius: 12px; z-index: 1;"></div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var map = L.map('{{ $id }}').setView([{{ $lat }}, {{ $lon }}], {{ $zoom }});
    
    // 使用高德地图瓦片源（国内访问快）
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1', '2', '3', '4'],
      attribution: '© 高德地图'
    }).addTo(map);

    // 添加标记
    L.marker([{{ $lat }}, {{ $lon }}]).addTo(map)
      .bindPopup('{{ $popup }}')
      .openPopup();
  });
</script>
